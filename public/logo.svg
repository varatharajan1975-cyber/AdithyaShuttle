<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 132" role="img" aria-label="Adithya Sports Academy">
  <defs>
    <linearGradient id="asGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9e5a0" />
      <stop offset="35%" stop-color="#e8b22e" />
      <stop offset="62%" stop-color="#fdf3d2" />
      <stop offset="100%" stop-color="#ab7714" />
    </linearGradient>
    <linearGradient id="asSilver" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#f4f5f7" />
      <stop offset="45%" stop-color="#b8bdc8" />
      <stop offset="70%" stop-color="#f4f5f7" />
      <stop offset="100%" stop-color="#8f95a3" />
    </linearGradient>
  </defs>

  <!-- Shield -->
  <path
    d="M60 3 112 20v52c0 26-21 45-52 57C29 117 8 98 8 72V20L60 3Z"
    fill="#07070a"
    stroke="url(#asGold)"
    stroke-width="5"
    stroke-linejoin="round"
  />
  <path
    d="M60 14 102 27v44c0 21-17 37-42 47-25-10-42-26-42-47V27L60 14Z"
    fill="none"
    stroke="url(#asGold)"
    stroke-width="1.75"
    opacity="0.55"
  />

  <!-- AS monogram -->
  <text
    x="60"
    y="72"
    text-anchor="middle"
    font-family="Sora, 'Segoe UI', system-ui, sans-serif"
    font-size="40"
    font-weight="800"
    font-style="italic"
    letter-spacing="-1"
    fill="url(#asSilver)"
  >AS</text>

  <!-- Name plate -->
  <path d="M22 84h76l-6 11H28l-6-11Z" fill="url(#asGold)" />
  <text
    x="60"
    y="92.5"
    text-anchor="middle"
    font-family="Sora, 'Segoe UI', system-ui, sans-serif"
    font-size="8.5"
    font-weight="700"
    letter-spacing="1.4"
    fill="#07070a"
  >ADITHYA</text>
  <text
    x="60"
    y="104"
    text-anchor="middle"
    font-family="Sora, 'Segoe UI', system-ui, sans-serif"
    font-size="5.4"
    font-weight="600"
    letter-spacing="2.6"
    fill="url(#asGold)"
  >SPORTS ACADEMY</text>

  <!-- Star flourish -->
  <path
    d="M60 110.5l1.9 4 4.4.6-3.2 3.1.8 4.4-3.9-2.1-3.9 2.1.8-4.4-3.2-3.1 4.4-.6 1.9-4Z"
    fill="url(#asGold)"
  />
</svg>
